        item && item.summary,
        item && item.quickRead,
        item && item.quickContext,
        item && item.modalSummary,
        item && item.label,
        item && item.category,
        item && item.signal,
        item && item.source,
        item && item.status,
        item && item.roundStatus,
        item && item.tournamentStatus,
        item && item.leaderboardStatus,
        item && item.scoringStatus,
        item && item.state,
        item && item.validation_status,
        item && item.validationStatus,
        item && item.validation_notes,
        item && item.validationNotes
      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();
    }

    function hasContradictionFlag(item) {
      const text = getStorySafetyText(item);

      const flags = [
        "did not win",
        "does not match",
        "per the provided leaderboard",
        "actually",
        "instead",
        "conflicting",
        "provided data says",
        "not the winner",
        "incorrect",
        "mismatch",
        "needs review"
      ];

      return flags.some(function (flag) {
        return text.includes(flag);
      });
    }

    function hasBadValidationStatus(item) {
      const status = String(
        (item && (item.validation_status || item.validationStatus || item.validationStatusText)) || ""
      ).toLowerCase();

      return status === "invalid" || status === "needs_review" || status === "needs review";
    }

    function looksLikeWinnerClaim(item) {
      const text = getStorySafetyText(item);

      return (
        /\bwins?\b/.test(text) ||
        /\bwon\b/.test(text) ||
        /\bwinner\b/.test(text) ||
        /\bchampion\b/.test(text) ||
        /\bcrowned\b/.test(text) ||
        /\bclaims?\s+(the\s+)?title\b/.test(text) ||
        /\bcaptures?\b/.test(text) ||
        /\btakes?\s+(the\s+)?title\b/.test(text) ||
        /\bholds off\b/.test(text)
      );
    }

    function hasConfirmedFinalSignal(item) {
      const text = getStorySafetyText(item);

      return (
        /\bofficial\b/.test(text) ||
        /\bconfirmed\b/.test(text) ||
        /\btournament complete\b/.test(text) ||
        /\btournament completed\b/.test(text) ||
        /\bleaderboard final\b/.test(text) ||
        /\bfinal leaderboard\b/.test(text) ||
        /\bfinal results?\b/.test(text) ||
        /\bstatus:\s*final\b/.test(text) ||
        /\bstatus:\s*complete\b/.test(text) ||
        /\bstatus:\s*completed\b/.test(text)
      );
    }

    function hasLiveOrInProgressSignal(item) {
      const text = getStorySafetyText(item);

      return (
        /\blive\b/.test(text) ||
        /\bthrough\b/.test(text) ||
        /\bthru\b/.test(text) ||
        /\boverall through\b/.test(text) ||
        /\bafter\s+\d+\b/.test(text) ||
        /\bround\s+[123]\b/.test(text) ||
        /\bleads?\b/.test(text) ||
        /\bleaderboard\b/.test(text) ||
        /\bprojected\b/.test(text) ||
        /\bcurrently\b/.test(text) ||
        /\bin progress\b/.test(text) ||
        /\bnot final\b/.test(text)
      );
    }

    function isUnsafeWinnerClaim(item) {
      if (!looksLikeWinnerClaim(item)) return false;
      if (!hasConfirmedFinalSignal(item)) return true;
      if (hasLiveOrInProgressSignal(item) && !hasConfirmedFinalSignal(item)) return true;
      return false;
    }

    function isSafeRadarStory(item) {
      if (!item || !item.title) return false;
      if (hasBadValidationStatus(item)) return false;
      if (hasContradictionFlag(item)) return false;
      if (isUnsafeWinnerClaim(item)) return false;
      return true;
    }

    function normalizeManualArticle(article, index) {
      return {
        ...article,
        id: "manual-" + index,
        source: article.source || "Morning Tee",
        category: cleanCategory(article.category || "Feature"),
        manual: true
      };
    }

    function normalizeRadarItem(item, index) {
      return {
        ...item,
        id: "radar-" + index,
        title: item.title || "Untitled story",
        category: inferCategory(item),
        author: item.author || item.byline || item.source || "Morning Tee Radar",
        date: item.date || "",
        readTime: item.readTime || "Quick read",
        url: item.sourceUrl || item.url || "#",
        summary: getStorySummary(item),
        manual: false
      };
    }

    function buildStoryPool(data) {
  const today = Array.isArray(data.today) ? data.today : [];
  const weekRadar = Array.isArray(data.weekRadar || data.week_radar) ? (data.weekRadar || data.week_radar) : [];
  const alsoMoving = Array.isArray(data.alsoMoving) ? data.alsoMoving : [];
  const golfInternet = Array.isArray(data.golfInternet || data.golf_internet) ? (data.golfInternet || data.golf_internet) : [];
  const archiveStories = Array.isArray(data.stories) ? data.stories : [];

  const orderedFeed = [
    ...today,
    ...weekRadar,
    ...alsoMoving,
    ...golfInternet,
    ...archiveStories
  ];

  const radarStories = orderedFeed
    .filter(isSafeRadarStory)
    .map(function (item, index) {
      return {
        ...normalizeRadarItem(item, index),
        feedOrder: index
      };
    });

  const seen = new Set();

  return radarStories
    .filter((item) => {
      const key = getStoryKey(item);
      if (!key || seen.has(key)) return false;
      seen.add(key);
      return true;
    })
    .sort(function (a, b) {
      return getItemTimestamp(b) - getItemTimestamp(a);
    });
}

    function renderOriginalStories() {
      const grid = document.getElementById("mt-originals-grid");
      const moreWrap = document.getElementById("mt-originals-more-wrap");
      const moreButton = document.getElementById("mt-originals-more");
      if (!grid) return;

      usedImagesThisRender = new Set();

      const originals = manualArticles.map(normalizeManualArticle);
      const visibleOriginals = originals.slice(0, originalsVisibleCount);

      grid.innerHTML = visibleOriginals.map(function (item, index) {
        const image = getUniqueImageForStory(item, index);

        return `
          <a class="mt-story-card" href="${escapeHtml(item.url || "#")}" target="_top" rel="noopener">
            <img class="mt-card-image" src="${escapeHtml(image)}" alt="${escapeHtml(getStoryImageAlt(item))}" loading="${index < 3 ? "eager" : "lazy"}" data-mt-fallbacks="${escapeHtml(getImageFallbacksForStory(item, index).join("|"))}" data-mt-fallback-index="0" onerror="window.mtSwapBrokenImage && window.mtSwapBrokenImage(this)">
            <div class="mt-card-category">${escapeHtml(item.category || "Feature")}</div>
            <h3>${escapeHtml(getDisplayTitle(item.title || "Untitled story"))}</h3>
            <p>${escapeHtml(truncateText(getStorySummary(item), 105))}</p>
            <div class="mt-card-meta">${escapeHtml(getStoryMeta(item))}</div>
          </a>
        `;
      }).join("");

      if (moreWrap) moreWrap.hidden = originalsVisibleCount >= originals.length;
      if (moreButton) moreButton.textContent = "See more originals";
    }

    function openStoryModal(item, openerEl) {
      if (!item) return;

      if (!isSafeRadarStory(item)) {
        console.warn("Blocked unsafe Morning Tee radar story:", item);
        return;
      }

      unlockPageScroll();

      const modal = document.getElementById("mt-story-modal");
      const modalCard = document.querySelector(".mt-story-modal-card");
      const kicker = document.getElementById("mt-story-modal-kicker");
      const title = document.getElementById("mt-story-modal-title");
      const meta = document.getElementById("mt-story-modal-meta");
      const body = document.getElementById("mt-story-modal-body");
      const link = document.getElementById("mt-story-modal-link");

      if (!modal) return;

      kicker.textContent = item.category || "Story";
      title.textContent = item.title || "Untitled story";
      meta.textContent = getStoryMeta(item);
      body.innerHTML = getStoryBodyHtml(item);

      if (item.url && item.url !== "#") {
        link.href = item.url;
        link.textContent = "Read full story";
        link.hidden = false;
      } else {
        link.hidden = true;
      }

      const isMobile = window.matchMedia("(max-width: 700px)").matches;

      if (isMobile && openerEl) {
        const pageTop = window.pageYOffset || document.documentElement.scrollTop || 0;
        const openerRect = openerEl.getBoundingClientRect();
        const modalTop = Math.max(0, pageTop + openerRect.top - 18);

        modal.style.setProperty("--mt-modal-top", modalTop + "px");
      } else {
        modal.style.removeProperty("--mt-modal-top");
      }

      mtStoryModalOpener = openerEl || document.activeElement;

      modal.classList.add("is-open");
      modal.setAttribute("aria-hidden", "false");
      document.body.classList.add("mt-modal-open");

      requestAnimationFrame(function () {
        if (modalCard) modalCard.scrollTop = 0;

        if (isMobile) {
          modal.scrollIntoView({
            behavior: "auto",
            block: "start"
          });
        }
      });

      const closeButton = document.getElementById("mt-story-modal-close") || document.querySelector("[aria-label='Close quick read']");
      if (closeButton) closeButton.focus();
    }

    function closeStoryModal() {
      const modal = document.getElementById("mt-story-modal");
      if (!modal) return;

      modal.classList.remove("is-open");
      modal.setAttribute("aria-hidden", "true");
      modal.style.removeProperty("--mt-modal-top");

      unlockPageScroll();

      if (mtStoryModalOpener && typeof mtStoryModalOpener.focus === "function") {
        mtStoryModalOpener.focus();
      }
      mtStoryModalOpener = null;
    }

    function renderStoryGrid() {
      unlockPageScroll();

      const grid = document.getElementById("mt-story-grid");
      const loadMore = document.getElementById("mt-load-more");

      if (!grid) return;

      const visible = filteredStories.slice(0, visibleCount);

      if (!visible.length) {
        grid.innerHTML = `
          <article class="mt-story-card">
            <div class="mt-card-image-empty"></div>
            <div class="mt-card-category">No results</div>
            <h3>No stories found</h3>
            <p>Try a different search term or category.</p>
          </article>
        `;

        if (loadMore) loadMore.hidden = true;
        return;
      }

      window.mtVisibleStories = visible;
      usedImagesThisRender = new Set();

      grid.innerHTML = visible.map((item, index) => {
        const image = getUniqueImageForStory(item, index);

        return `
          <a class="mt-story-card" href="${escapeHtml(item.url || "#")}" target="_blank" rel="noopener noreferrer" data-story-index="${index}">
            <img class="mt-card-image" src="${escapeHtml(image)}" alt="${escapeHtml(getStoryImageAlt(item))}" loading="lazy" data-mt-fallbacks="${escapeHtml(getImageFallbacksForStory(item, index).join("|"))}" data-mt-fallback-index="0" onerror="window.mtSwapBrokenImage && window.mtSwapBrokenImage(this)">
            <div class="mt-card-category">${escapeHtml(item.category || "Golf")}</div>
            <h3>${escapeHtml(getDisplayTitle(item.title || "Untitled story"))}</h3>
            <p>${escapeHtml(truncateText(getStorySummary(item), 95))}</p>
            <div class="mt-card-meta">${escapeHtml(getStoryMeta(item))}</div>
          </a>
        `;
      }).join("");

      grid.querySelectorAll("[data-story-index]").forEach((card) => {
        card.addEventListener("click", function (event) {
          const index = Number(card.getAttribute("data-story-index"));
          const story = window.mtVisibleStories && window.mtVisibleStories[index];

          if (!story) return;

          event.preventDefault();
          openStoryModal(story, card);
        });
      });

      if (loadMore) {
        loadMore.hidden = visibleCount >= filteredStories.length;
      }
    }

    function applyFilters() {
      const search = normalizeText(document.getElementById("mt-story-search")?.value || "");
      const filter = document.getElementById("mt-story-filter")?.value || "all";

      visibleCount = initialVisibleCount;

      filteredStories = allStories.filter((item) => {
        const categoryMatch = filter === "all" || normalizeText(item.category) === normalizeText(filter);

        const searchText = normalizeText([
          item.title,
          item.summary,
          item.quickRead,
          item.body && JSON.stringify(item.body),
          item.category,
          ...(Array.isArray(item.topics) ? item.topics : []),
          item.author,
          item.source
        ].filter(Boolean).join(" "));

        const searchMatch = !search || searchText.includes(search);

        return categoryMatch && searchMatch;
      });

      renderStoryGrid();
    }

    async function loadStories() {
    unlockPageScroll();
    
    try {
    const cacheBust = "?v=" + Date.now();
    
    const [latestResult, archiveResult] = await Promise.allSettled([
    fetch(radarUrl + cacheBust, { cache: "no-store" }),
    fetch(archiveUrl + cacheBust, { cache: "no-store" })
    ]);
    
    let latestData = {};
    let archiveData = {};
    
    if (latestResult.status === "fulfilled" && latestResult.value.ok) {
    latestData = await latestResult.value.json();
    }
    
    if (archiveResult.status === "fulfilled" && archiveResult.value.ok) {
    archiveData = await archiveResult.value.json();
    }
    
    const mergedData = {
    active: true,
    today: Array.isArray(latestData.today) ? latestData.today : [],
    weekRadar: Array.isArray(latestData.weekRadar || latestData.week_radar) ? (latestData.weekRadar ||
    latestData.week_radar) : [],
    alsoMoving: Array.isArray(latestData.alsoMoving) ? latestData.alsoMoving : [],
    golfInternet: Array.isArray(latestData.golfInternet || latestData.golf_internet) ? (latestData.golfInternet ||
    latestData.golf_internet) : [],
    stories: Array.isArray(archiveData.stories) ? archiveData.stories : []
    };
    
    allStories = buildStoryPool(mergedData);
    } catch (error) {
    console.error("Morning Tee stories failed to load", error);
    allStories = buildStoryPool({});
    }
    
    filteredStories = allStories.slice();
    renderStoryGrid();
    }

    document.getElementById("mt-story-search")?.addEventListener("input", applyFilters);
    document.getElementById("mt-story-filter")?.addEventListener("change", applyFilters);

    document.getElementById("mt-load-more")?.addEventListener("click", function () {
      unlockPageScroll();
      visibleCount += loadMoreStep;
      renderStoryGrid();
    });

    document.getElementById("mt-originals-more")?.addEventListener("click", function () {
      unlockPageScroll();
      originalsVisibleCount += originalsInitialVisibleCount;
      renderOriginalStories();
    });

    document.addEventListener("click", function (event) {
      if (event.target && event.target.id === "mt-story-modal-backdrop") closeStoryModal();
      if (event.target && event.target.id === "mt-story-modal-close") closeStoryModal();
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") closeStoryModal();
    });

    window.addEventListener("pageshow", unlockPageScroll);
    window.addEventListener("resize", unlockPageScroll);

    renderOriginalStories();
    loadStories();
  })();
</script>

    const observer = new MutationObserver(beehiiv_sendHeight("MutationObserver"));
    try {
      observer.observe(document.body, { childList: true, subtree: true });
    }
    catch (e) {
      console.error(e)
    }
