name: Tour category regression tests

on:
  pull_request:
    paths:
      - "reddit-checker.js"
      - "lib/tour-category.js"
      - "tests/tour-category.test.js"
      - ".github/workflows/category-tests.yml"
  push:
    branches: [main]
    paths:
      - "reddit-checker.js"
      - "lib/tour-category.js"
      - "tests/tour-category.test.js"
      - ".github/workflows/category-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/tour-category.test.js
