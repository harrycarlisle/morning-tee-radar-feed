name: radar.yml

on:
  schedule:
    # Normal radar checks, every 2 hours in UTC
    - cron: "0 */2 * * *"

    # Championship Sunday live window, America/Toronto (EST and EDT)
    # 1:30pm and 1:45pm ET
    - cron: "30,45 13 * * 0"
      timezone: "America/Toronto"

    # 2:15pm through 6:45pm ET, excluding the top of each hour
    - cron: "15,30,45 14-18 * * 0"
      timezone: "America/Toronto"

    # Complete the hourly checks from 2:00pm through 7:00pm ET without
    # overlapping the normal even-UTC-hour checks above:
    # 19/21/23 UTC = 3/5/7pm EDT or 2/4/6pm EST.
    # The normal Monday 00:00 UTC check supplies Sunday 7:00pm EST.
    - cron: "0 19,21,23 * * 0"
      timezone: "Etc/UTC"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning-tee-radar
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      AUTO_PUBLISH: "true"
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: morning-tee-radar-feed
      GITHUB_BRANCH: main
      GITHUB_RADAR_PATH: latest-radar.json

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.2

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync latest repo state
        run: git pull --rebase

      - name: Run radar
        run: node reddit-checker.js

      - name: Commit radar updates
        run: |
          git config user.name "Morning Tee Radar Bot"
          git config user.email "actions@github.com"

          git add latest-radar.json seen-posts.json golf-internet-seen.json golf-internet-archive.json

          git diff --cached --quiet || git commit -m "Update radar feed"

          git pull --rebase

          git push || {
            git pull --rebase
            git push
          }
