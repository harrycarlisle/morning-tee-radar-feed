name: radar.yml

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning-tee-radar
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      AUTO_PUBLISH: "true"
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: morning-tee-radar-feed
      GITHUB_BRANCH: main
      GITHUB_RADAR_PATH: latest-radar.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync latest repo state
        run: git pull --rebase

      - name: Run radar
        run: node reddit-checker.js

      - name: Commit seen posts
        run: |
          git config user.name "Morning Tee Radar Bot"
          git config user.email "actions@github.com"

          git add seen-posts.json golf-internet-seen.json golf-internet-archive.json
          git diff --cached --quiet || git commit -m "Update seen radar posts"

          git pull --rebase

          git push || {
            git pull --rebase
            git push
          }
