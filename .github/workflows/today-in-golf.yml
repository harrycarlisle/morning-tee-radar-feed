name: Update Today in Golf

on:
  schedule:
    # Runs at 8 AM, 12 PM, and 8 PM ET during daylight saving time.
    # GitHub cron uses UTC.
    - cron: "7 12 * * *"
    - cron: "7 16 * * *"
    - cron: "7 0 * * *"

    # Runs at 8 AM, 12 PM, and 8 PM ET during standard time.
    # These keep the schedule correct when Eastern Time shifts.
    - cron: "7 13 * * *"
    - cron: "7 17 * * *"
    - cron: "7 1 * * *"

  workflow_dispatch:
    inputs:
      edition:
        description: "Edition to generate"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - morning
          - midday
          - evening
      force_run:
        description: "Force update even if this edition already ran today"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: today-in-golf
  cancel-in-progress: false

jobs:
  update-today-in-golf:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Today in Golf
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MANUAL_EDITION: ${{ github.event.inputs.edition || 'auto' }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_run || 'false' }}
        run: node scripts/generate-today-in-golf.js

      - name: Commit updated briefing
        run: |
          if [[ -n "$(git status --porcelain today-in-golf.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add today-in-golf.json
            git commit -m "Update Today in Golf"

            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi
