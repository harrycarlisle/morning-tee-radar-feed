name: Update Today in Golf

on:
  schedule:
    # Morning target, 8 AM ET
    # Daylight time: 8:01, 8:07, 8:13 AM ET
    - cron: "1 12 * * *"
    - cron: "7 12 * * *"
    - cron: "13 12 * * *"

    # Standard time: 8:01, 8:07, 8:13 AM ET
    - cron: "1 13 * * *"
    - cron: "7 13 * * *"
    - cron: "13 13 * * *"

    # Midday target, 12 PM ET
    # Daylight time: 12:01, 12:07, 12:13 PM ET
    - cron: "1 16 * * *"
    - cron: "7 16 * * *"
    - cron: "13 16 * * *"

    # Standard time: 12:01, 12:07, 12:13 PM ET
    - cron: "1 17 * * *"
    - cron: "7 17 * * *"
    - cron: "13 17 * * *"

    # Evening target, 8 PM ET
    # Daylight time: 8:01, 8:07, 8:13 PM ET
    - cron: "1 0 * * *"
    - cron: "7 0 * * *"
    - cron: "13 0 * * *"

    # Standard time: 8:01, 8:07, 8:13 PM ET
    - cron: "1 1 * * *"
    - cron: "7 1 * * *"
    - cron: "13 1 * * *"

  workflow_dispatch:
    inputs:
      edition:
        description: "Edition to generate"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - morning
          - midday
          - evening
      force_run:
        description: "Force update even if this edition already ran today"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  update-today-in-golf:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Today in Golf
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MANUAL_EDITION: ${{ github.event.inputs.edition || 'auto' }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: node scripts/generate-today-in-golf.js

      - name: Commit updated briefing
        run: |
          if [[ -n "$(git status --porcelain today-in-golf.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add today-in-golf.json
            git commit -m "Update Today in Golf"

            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi
